<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Skriptjobs — Full Screenshot Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      display: block;
      cursor: grab;
      -webkit-user-drag: element;
    }
    img:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <img id="fullPreviewImg" draggable="true" alt="Skriptjobs Framed Screenshot" />
  <script src="preview.js"></script>
</body>
</html>
