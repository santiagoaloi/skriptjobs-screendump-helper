<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Skriptjobs - Screendump Helper</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      background: #ffffff;
      color: #111111;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0e0e0e;
        color: #e4e4e7;
      }
    }
    .logs-toolbar {
      position: fixed;
      top: 12px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    .logs-btn {
      appearance: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.35);
      background: rgba(128, 128, 128, 0.1);
      color: inherit;
      cursor: pointer;
    }
    .logs-btn:hover {
      background: rgba(128, 128, 128, 0.2);
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="logs-toolbar">
    <button id="btnClearLogsPage" type="button" class="logs-btn">Erase Logs</button>
  </div>
  <pre id="logsOutput">[]</pre>
  <script type="module" src="logs.js"></script>
</body>
</html>
