<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Skriptjobs - Screendump Helper</title>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("assets/fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    /* ==========================================================================
       @skriptjobs/ui + @nuxt/ui v4 Design System Tokens (Neutral Light & Dark)
       Zero transitions on theme changes or accordion chevrons.
       Scaled up (540px container, larger typography, zero scrollbars).
       ========================================================================== */
    :root, html.light {
      color-scheme: light;
      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Light surfaces (--ui-bg*) */
      --ui-bg: #fafafa;
      --ui-bg-muted: #f4f4f5;
      --ui-bg-elevated: #ffffff;
      --ui-bg-accented: #e4e4e7;
      --ui-bg-inverted: #18181b;
      --ui-bg-card-hover: #f4f4f5;
      --ui-header-surface: rgba(244, 244, 245, 0.75);
      --ui-preview-stage: #f0f0f3;

      /* Neutral Borders (--ui-border*) */
      --ui-border: #e4e4e7;
      --ui-border-muted: #d4d4d8;
      --ui-border-accented: #a1a1aa;
      --ui-border-focus: #71717a;

      /* Typography (--ui-text*) */
      --ui-text-highlighted: #09090b;
      --ui-text: #18181b;
      --ui-text-muted: #52525b;
      --ui-text-dimmed: #71717a;

      /* Scrollbar tokens */
      --scrollbar-track: #f4f4f5;
      --scrollbar-thumb: #d4d4d8;
      --scrollbar-thumb-hover: #a1a1aa;

      --ui-radius: 0.55rem;
    }

    html.dark {
      color-scheme: dark;

      /* Achromatic dark surfaces (--ui-bg*) */
      --ui-bg: #0e0e0e;
      --ui-bg-muted: #1a1a1a;
      --ui-bg-elevated: #141414;
      --ui-bg-accented: #262626;
      --ui-bg-inverted: #f4f4f5;
      --ui-bg-card-hover: #1c1c1c;
      --ui-header-surface: rgba(26, 26, 26, 0.55);
      --ui-preview-stage: #080808;

      /* Neutral Borders (--ui-border*) */
      --ui-border: #262626;
      --ui-border-muted: #333333;
      --ui-border-accented: #52525b;
      --ui-border-focus: #71717a;

      /* Typography (--ui-text*) */
      --ui-text-highlighted: #ffffff;
      --ui-text: #e4e4e7;
      --ui-text-muted: #a1a1aa;
      --ui-text-dimmed: #71717a;

      /* Scrollbar tokens */
      --scrollbar-track: #141414;
      --scrollbar-thumb: #333333;
      --scrollbar-thumb-hover: #4b4b52;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: none;
      user-select: none;
      -webkit-user-select: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    img, svg, canvas {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
      font-family: var(--font-sans);
    }
    button, input, button:focus, button:focus-visible, input:focus, input:focus-visible {
      outline: none !important;
    }

    html, body {
      width: 540px;
      overflow-x: hidden;
      overflow-y: hidden;
      background-color: var(--ui-bg);
      color: var(--ui-text);
      font-family: var(--font-sans);
      letter-spacing: -0.01rem;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 8px 14px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Header (Skriptjobs wordmark + Baseline-Aligned Plain Text Title, no bottom border) */
    .u-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
    }
    .u-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .u-brand-logo {
      height: 31px;
      width: auto;
      display: block;
      margin-left: -4px;
      margin-right: -4px;
    }
    .u-divider-v {
      width: 1px;
      height: 16px;
      background: var(--ui-border-muted);
    }
    .u-brand-subtitle {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ui-text-muted);
      line-height: 1;
      transform: translateY(-0.5px);
    }

    /* Nuxt UI UCard */
    .u-card {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
    }
    .u-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-bottom: 1px solid var(--ui-border);
      background: var(--ui-header-surface);
      border-top-left-radius: calc(var(--ui-radius) - 1px);
      border-top-right-radius: calc(var(--ui-radius) - 1px);
    }
    .u-card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ui-text-highlighted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Live Mockup Preview Container (<ChromeIssueMockup />) with top-right Open in Tab button */
    .mockup-preview-wrap {
      position: relative;
      background: var(--ui-preview-stage);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom-left-radius: calc(var(--ui-radius) - 1px);
      border-bottom-right-radius: calc(var(--ui-radius) - 1px);
    }
    canvas#previewCanvas {
      max-width: 100%;
      max-height: 112px;
      width: auto;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .preview-open-tab-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text-highlighted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: none;
      z-index: 10;
    }
    .mockup-preview-wrap:hover .preview-open-tab-btn,
    .mockup-preview-wrap.force-hover .preview-open-tab-btn,
    .preview-open-tab-btn:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-open-tab-btn:hover {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
      color: var(--ui-text-highlighted);
    }

    /* ==========================================================================
       Nuxt UI UAccordion (type="single" collapsible — only 1 open at a time)
       ========================================================================== */
    .u-accordion {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
      display: flex;
      flex-direction: column;
    }
    .u-accordion-item {
      position: relative;
    }
    .u-accordion-item.open {
      z-index: 20;
    }
    .u-accordion-item + .u-accordion-item {
      border-top: 1px solid var(--ui-border);
    }
    .u-accordion-trigger {
      width: 100%;
      appearance: none;
      background: transparent;
      border: none;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      padding: 7.5px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }
    .u-accordion-trigger:hover {
      background: var(--ui-bg-card-hover);
    }
    .u-accordion-trigger-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .u-accordion-icon {
      width: 16px;
      height: 16px;
      color: var(--ui-text-muted);
      flex-shrink: 0;
    }
    .u-accordion-item.open .u-accordion-icon {
      color: var(--ui-text-highlighted);
    }
    .u-accordion-chevron {
      width: 15px;
      height: 15px;
      color: var(--ui-text-muted);
      flex-shrink: 0;
    }
    .u-accordion-item.open .u-accordion-chevron {
      transform: rotate(180deg);
      color: var(--ui-text-highlighted);
    }
    .u-accordion-body {
      display: none;
      padding: 2px 13px 10px 13px;
      overflow: visible;
    }
    .u-accordion-item.open .u-accordion-body {
      display: block;
    }

    /* Wallpapers section subbar */
    .wp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .wp-toolbar-label {
      font-size: 12.5px;
      color: var(--ui-text-muted);
    }
    .wp-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Multi-Wallpaper Gallery Grid (strictly 50/50 columns with ellipsis) */
    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      overflow: visible;
    }
    .wp-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 48px 5px 6px;
      border-radius: 8px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      cursor: pointer;
      position: relative;
      overflow: visible;
      min-width: 0;
      max-width: 100%;
      z-index: 1;
    }
    .wp-item.menu-open {
      z-index: 100;
    }
    .wp-item:hover,
    .wp-item.force-hover {
      background: var(--ui-bg-card-hover);
      border-color: var(--ui-border-muted);
    }
    .wp-item.active {
      border-color: var(--ui-border-accented);
      background: var(--ui-bg-muted);
      box-shadow: inset 0 0 0 1px var(--ui-border-muted);
    }
    .wp-thumb {
      width: 50px;
      height: 32px;
      border-radius: 5px;
      object-fit: cover;
      border: 1px solid var(--ui-border-muted);
      flex-shrink: 0;
    }
    .wp-meta {
      min-width: 0;
      flex: 1 1 0%;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .wp-name {
      display: block;
      width: 100%;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--ui-text-highlighted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wp-rename-input {
      width: 100%;
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-accented);
      border-radius: 5px;
      padding: 3px 6px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--ui-text-highlighted);
      outline: none;
    }

    /* Right actions on Wallpaper card: Default star badge + 3-dots menu button */
    .wp-corner-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .wp-default-indicator {
      width: 20px;
      height: 20px;
      color: var(--ui-text-highlighted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
    }
    .wp-menu-btn {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ui-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .wp-menu-btn:hover,
    .wp-menu-btn.active {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-muted);
      color: var(--ui-text-highlighted);
    }

    /* 3-Dots Dropdown Menu on Wallpaper Card — exact width of image card, high z-index */
    .wp-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: -1px;
      right: -1px;
      width: calc(100% + 2px);
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-muted);
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      z-index: 120;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .wp-dropdown.open {
      display: flex;
    }
    .wp-dropdown-item {
      appearance: none;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ui-text);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6.5px 9px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      white-space: nowrap;
    }
    .wp-dropdown-item:hover {
      background: var(--ui-bg-muted);
      color: var(--ui-text-highlighted);
    }
    .wp-dropdown-item svg {
      width: 14px;
      height: 14px;
      color: var(--ui-text-muted);
      flex-shrink: 0;
    }
    .wp-dropdown-item:hover svg {
      color: var(--ui-text-highlighted);
    }

    /* Neutral Buttons + Icon-only Square Buttons + UTooltip (display:none when inactive so zero overflow!) */
    .u-btn {
      appearance: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      line-height: 1.2;
      position: relative;
    }
    .u-btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .u-btn-icon-sm {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .u-btn-soft,
    .u-btn-neutral {
      background: var(--ui-bg-muted);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text-highlighted);
    }
    .u-btn-soft:hover,
    .u-btn-neutral:hover,
    .u-btn-soft:focus-visible,
    .u-btn-neutral:focus-visible {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
      box-shadow: none;
    }

    /* @nuxt/ui UTooltip styling — display:none when inactive so it never creates document overflow */
    [data-tooltip]:not(.preview-open-tab-btn) {
      position: relative;
    }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ui-bg-elevated);
      color: var(--ui-text-highlighted);
      border: 1px solid var(--ui-border-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 4.5px 9px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      display: none;
      pointer-events: none;
      z-index: 150;
    }
    .preview-open-tab-btn[data-tooltip]::after,
    .u-header [data-tooltip]::after {
      bottom: auto;
      top: calc(100% + 6px);
    }
    .u-pin-btn.pinned {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
      color: var(--ui-text-highlighted);
    }
    [data-tooltip].tooltip-right::after {
      left: auto;
      right: 0;
      transform: none;
    }
    [data-tooltip].tooltip-left::after {
      left: 0;
      transform: none;
    }
    [data-tooltip]:hover::after,
    [data-tooltip]:focus-visible::after,
    [data-tooltip].force-tooltip::after {
      display: block;
    }

    /* Image Operations Row inside Accordion (All Square Icon Buttons) */
    .u-ops-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 3px;
    }

    /* Output & Settings Form Stacks */
    .u-settings-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 2px;
    }
    .u-form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .u-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .u-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ui-text);
    }
    .u-hint {
      font-size: 11.5px;
      color: var(--ui-text-dimmed);
      font-family: var(--font-mono);
    }
    .u-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .u-favicon-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .u-favicon-preview {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      object-fit: contain;
      position: absolute;
      left: 10px;
      pointer-events: none;
    }
    .u-input-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--ui-text-dimmed);
      pointer-events: none;
    }
    /* Neutral border input fields (Geist font, no primary border, no transitions) */
    .u-input {
      width: 100%;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
      border-radius: 7px;
      padding: 5.5px 10px 5.5px 31px;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 12.5px;
      outline: none;
    }
    .u-input.mono {
      font-family: var(--font-sans);
      font-size: 12.5px;
    }
    .u-input.has-trailing {
      padding-right: 34px;
    }
    .u-input-trailing-btn {
      appearance: none;
      position: absolute;
      right: 5px;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--ui-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .u-input-trailing-btn:hover {
      background: var(--ui-bg-muted);
      color: var(--ui-text-highlighted);
    }
    .u-input:hover {
      border-color: var(--ui-border-accented);
    }
    .u-input:focus {
      border-color: var(--ui-border-focus);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui-text-muted) 16%, transparent);
    }

    /* Segmented Theme Control (System | Dark | Light) — Neutral */
    .u-theme-segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 7px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
    }
    .u-theme-option {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ui-text-muted);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .u-theme-option:hover {
      color: var(--ui-text-highlighted);
      background: var(--ui-bg-card-hover);
    }
    .u-theme-option.active {
      background: var(--ui-bg-muted);
      border-color: var(--ui-border-muted);
      color: var(--ui-text-highlighted);
      font-weight: 600;
    }
    .u-theme-option svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Neutral Switch Row (Sync Browser Mockup Theme) */
    .u-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6.5px 10px;
      border-radius: 7px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
    }
    .u-switch-copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .u-switch-title {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ui-text-highlighted);
    }
    .u-switch-sub {
      font-size: 11.5px;
      color: var(--ui-text-muted);
    }
    .u-switch {
      appearance: none;
      width: 38px;
      height: 21px;
      border-radius: 9999px;
      background: var(--ui-bg-accented);
      border: 1px solid var(--ui-border-muted);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .u-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: var(--ui-text-muted);
    }
    .u-switch[aria-checked="true"] {
      background: var(--ui-text-highlighted);
      border-color: var(--ui-text-highlighted);
    }
    .u-switch[aria-checked="true"]::after {
      transform: translateX(17px);
      background: var(--ui-bg-elevated);
    }

    /* Status Toast Bar with Ghost Undo Button + Close Icon */
    .u-status {
      font-size: 12.5px;
      padding: 5.5px 8px 5.5px 12px;
      border-radius: 7px;
      background: var(--ui-bg-muted);
