<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Skriptjobs Screendump Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       @skriptjobs/ui + @nuxt/ui v4 Design System Tokens (from main.css)
       ========================================================================== */
    :root, .dark {
      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Achromatic dark surfaces (--ui-bg*) */
      --ui-bg: #0e0e0e;
      --ui-bg-muted: #1a1a1a;
      --ui-bg-elevated: #141414;
      --ui-bg-accented: #262626;
      --ui-bg-inverted: #ffffff;
      --ui-bg-card-hover: #1c1c1c;

      /* Borders (--ui-border*) */
      --ui-border: #262626;
      --ui-border-muted: #333333;
      --ui-border-accented: #3f3f46;

      /* Typography (--ui-text*) */
      --ui-text-highlighted: #ffffff;
      --ui-text: #e4e4e7;
      --ui-text-muted: #a1a1aa;
      --ui-text-dimmed: #71717a;

      /* Brand & Primary CTA (--skript-primary-solid-*) */
      --ui-primary: #89a3c0;
      --skript-primary-solid-bg: #89a3c0;
      --skript-primary-solid-bg-hover: #7a94b0;
      --skript-primary-solid-fg: #141414;

      --ui-radius: 0.5rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow: hidden;
    }

    body {
      width: 460px;
      background-color: var(--ui-bg);
      color: var(--ui-text);
      font-family: var(--font-sans);
      letter-spacing: -0.01rem;
      -webkit-font-smoothing: antialiased;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* Header (Skriptjobs wordmark + Harmonic Plain Text Title) */
    .u-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ui-border);
    }
    .u-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .u-brand-logo {
      height: 30px;
      width: auto;
      display: block;
      margin-left: -5px;
      margin-right: -5px;
    }
    .u-divider-v {
      width: 1px;
      height: 16px;
      background: var(--ui-border-muted);
    }
    .u-brand-subtitle {
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ui-text-muted);
      line-height: 1;
      transform: translateY(0.5px);
    }

    /* Nuxt UI UCard */
    .u-card {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
    }
    .u-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--ui-border);
      background: rgba(26, 26, 26, 0.55);
      border-top-left-radius: calc(var(--ui-radius) - 1px);
      border-top-right-radius: calc(var(--ui-radius) - 1px);
    }
    .u-card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ui-text-highlighted);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Live Mockup Preview Container (<ChromeIssueMockup />) with top-right Open in Tab button */
    .mockup-preview-wrap {
      position: relative;
      background: #080808;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom-left-radius: calc(var(--ui-radius) - 1px);
      border-bottom-right-radius: calc(var(--ui-radius) - 1px);
    }
    canvas#previewCanvas {
      max-width: 100%;
      max-height: 192px;
      width: auto;
      height: auto;
      border-radius: 6px;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .preview-open-tab-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(14, 14, 14, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f4f4f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
      z-index: 10;
    }
    .mockup-preview-wrap:hover .preview-open-tab-btn,
    .mockup-preview-wrap.force-hover .preview-open-tab-btn,
    .preview-open-tab-btn:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-open-tab-btn:hover {
      background: rgba(20, 20, 20, 0.94);
      border-color: var(--ui-primary);
      color: #ffffff;
      transform: scale(1.04);
    }

    /* ==========================================================================
       Nuxt UI UAccordion (type="single" collapsible — only 1 open at a time)
       ========================================================================== */
    .u-accordion {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
      display: flex;
      flex-direction: column;
    }
    .u-accordion-item + .u-accordion-item {
      border-top: 1px solid var(--ui-border);
    }
    .u-accordion-trigger {
      width: 100%;
      appearance: none;
      background: transparent;
      border: none;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
      text-align: left;
    }
    .u-accordion-trigger:hover {
      background: rgba(255, 255, 255, 0.025);
    }
    .u-accordion-trigger-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .u-accordion-icon {
      width: 14px;
      height: 14px;
      color: var(--ui-primary);
      flex-shrink: 0;
    }
    .u-accordion-chevron {
      width: 14px;
      height: 14px;
      color: var(--ui-text-muted);
      transition: transform 0.18s ease;
      flex-shrink: 0;
    }
    .u-accordion-item.open .u-accordion-chevron {
      transform: rotate(180deg);
      color: var(--ui-text-highlighted);
    }
    .u-accordion-body {
      display: none;
      padding: 2px 12px 10px 12px;
    }
    .u-accordion-item.open .u-accordion-body {
      display: block;
    }

    /* Wallpapers section subbar */
    .wp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .wp-toolbar-label {
      font-size: 11px;
      color: var(--ui-text-muted);
    }

    /* Multi-Wallpaper Gallery Grid */
    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 126px;
      overflow-y: auto;
    }
    .wp-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 26px 6px 6px;
      border-radius: 7px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      cursor: pointer;
      transition: all 0.14s ease;
      position: relative;
    }
    .wp-item:hover,
    .wp-item.force-hover {
      background: var(--ui-bg-card-hover);
      border-color: var(--ui-border-muted);
    }
    .wp-item.active {
      border-color: var(--ui-primary);
      background: rgba(137, 163, 192, 0.08);
      box-shadow: 0 0 0 1px rgba(137, 163, 192, 0.25);
    }
    .wp-thumb {
      width: 44px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--ui-border-muted);
      flex-shrink: 0;
    }
    .wp-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .wp-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ui-text-highlighted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Top-right Star Icon (Fixed on default wallpaper, shown on hover for others) */
    .wp-corner-actions {
      position: absolute;
      top: 5px;
      right: 5px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .wp-star-btn,
    .wp-del-btn {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--ui-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.14s ease, color 0.14s ease, background 0.14s ease;
    }
    /* Fixed & always visible when this wallpaper is the default */
    .wp-star-btn.is-default {
      opacity: 1;
      color: var(--ui-primary);
    }
    /* Reveal on hover for non-default wallpapers */
    .wp-item:hover .wp-star-btn,
    .wp-item.force-hover .wp-star-btn,
    .wp-item:hover .wp-del-btn,
    .wp-item.force-hover .wp-del-btn {
      opacity: 1;
    }
    .wp-star-btn:hover {
      background: rgba(137, 163, 192, 0.16);
      color: #c5d8ec;
    }
    .wp-del-btn {
      color: #f87171;
    }
    .wp-del-btn:hover {
      background: rgba(248, 113, 113, 0.16);
      color: #fecaca;
    }

    /* Nuxt UI UButton + Icon-only Square Buttons + UTooltip */
    .u-btn {
      appearance: none;
      border-radius: 6px;
      padding: 7.5px 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.14s ease;
      line-height: 1.2;
      position: relative;
    }
    .u-btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .u-btn-icon-sm {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .u-btn-soft {
      background: var(--ui-bg-muted);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text-highlighted);
    }
    .u-btn-soft:hover {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
    }
    .u-btn-primary-solid {
      background: var(--skript-primary-solid-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--skript-primary-solid-fg);
      font-weight: 600;
    }
    .u-btn-primary-solid:hover {
      background: var(--skript-primary-solid-bg-hover);
    }

    /* @nuxt/ui UTooltip styling */
    [data-tooltip]:not(.preview-open-tab-btn) {
      position: relative;
    }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-2px);
      background: #18181b;
      color: #fafafa;
      border: 1px solid var(--ui-border-accented);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 50;
    }
    [data-tooltip].tooltip-right::after {
      left: auto;
      right: 0;
      transform: translateY(-2px);
    }
    [data-tooltip].tooltip-left::after {
      left: 0;
      transform: translateY(-2px);
    }
    [data-tooltip]:hover::after,
    [data-tooltip]:focus-visible::after,
    [data-tooltip].force-tooltip::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    [data-tooltip].tooltip-right:hover::after,
    [data-tooltip].tooltip-right.force-tooltip::after {
      opacity: 1;
      transform: translateY(0);
    }
    [data-tooltip].tooltip-left:hover::after,
    [data-tooltip].tooltip-left.force-tooltip::after {
      opacity: 1;
      transform: translateY(0);
    }

    /* Image Operations Row inside Accordion */
    .u-ops-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 2px;
    }
    .u-ops-flex {
      flex: 1;
    }

    /* Nuxt UI UFormField + UInput inside Settings Accordion */
    .u-settings-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-top: 2px;
    }
    .u-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .u-form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .u-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .u-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--ui-text);
    }
    .u-hint {
      font-size: 10px;
      color: var(--ui-text-dimmed);
      font-family: var(--font-mono);
    }
    .u-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .u-input-icon {
      position: absolute;
      left: 9px;
      width: 13px;
      height: 13px;
      color: var(--ui-text-dimmed);
      pointer-events: none;
    }
    .u-input {
      width: 100%;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
      border-radius: 6px;
      padding: 6px 9px 6px 28px;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .u-input.mono {
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .u-input:focus {
      border-color: var(--ui-primary);
      box-shadow: 0 0 0 2px rgba(137, 163, 192, 0.2);
    }

    /* Status Toast Bar */
    .u-status {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--ui-bg-muted);
      border: 1px solid var(--ui-border);
      color: var(--ui-text-muted);
      display: none;
      word-break: break-all;
    }
    .u-status.visible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .u-status.success {
      border-color: rgba(40, 200, 64, 0.35);
      background: rgba(40, 200, 64, 0.08);
      color: #86efac;
    }
    .u-status.error {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.08);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <!-- Header: Official Skriptjobs Brand Logo + Harmonic Plain Text Title -->
  <header class="u-header">
    <div class="u-brand">
      <img src="assets/brand/wordmark-dark.svg" alt="Skriptjobs" class="u-brand-logo" />
      <span class="u-divider-v"></span>
      <span class="u-brand-subtitle">Screendump Helper</span>
    </div>
  </header>

  <!-- Live Framed Screenshot Preview Card (<ChromeIssueMockup />) -->
  <section class="u-card">
    <div class="u-card-header">
      <div class="u-card-title">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor">
          <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V88H40V56ZM40,200V104H216v96Z"/>
        </svg>
        Preview
      </div>
      <span class="u-hint" id="dimensionsBadge">1711 × 1076 px</span>
    </div>
    <div class="mockup-preview-wrap">
      <canvas id="previewCanvas" width="1711" height="1076"></canvas>
      <button
        id="btnOpenFullTab"
        type="button"
        class="preview-open-tab-btn tooltip-right"
        data-tooltip="Open full image in new tab"
        aria-label="Open full image in new tab"
      >
        <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor">
          <path d="M224,104a8,8,0,0,1-16,0V59.32l-66.33,66.34a8,8,0,0,1-11.32-11.32L196.68,48H152a8,8,0,0,1,0-16h64a8,8,0,0,1,8,8Zm-40,24a8,8,0,0,0-8,8v72H48V80h72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,80V208a16,16,0,0,0,16,16H176a16,16,0,0,0,16-16V136A8,8,0,0,0,184,128Z"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Single-Open Collapsible Accordion (only 1 item open at a time) -->
  <div class="u-accordion" id="mainAccordion">
    <!-- Accordion Item 1: Wallpapers -->
    <section class="u-accordion-item open" data-accordion-item="wallpapers">
      <button type="button" class="u-accordion-trigger" data-accordion-trigger="wallpapers">
        <span class="u-accordion-trigger-left">
          <svg class="u-accordion-icon" viewBox="0 0 256 256" fill="currentColor">
            <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z"/>
          </svg>
          <span>Wallpapers</span>
        </span>
        <svg class="u-accordion-chevron" viewBox="0 0 256 256" fill="currentColor">
          <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
        </svg>
      </button>
      <div class="u-accordion-body">
        <div class="wp-toolbar">
          <span class="wp-toolbar-label">Select background or set default</span>
          <div>
            <input id="multiWallpaperInput" type="file" multiple accept="image/*" style="display:none" />
            <button
              id="btnUploadWallpapers"
              type="button"
              class="u-btn u-btn-icon-sm u-btn-soft tooltip-right"
              data-tooltip="Upload wallpapers"
              aria-label="Upload wallpapers"
            >
              <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor">
                <path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="wallpaperGallery" class="wallpaper-grid"></div>
      </div>
    </section>

    <!-- Accordion Item 2: Image Operations (Copy, Download, Upload to Vercel Blob) -->
    <section class="u-accordion-item" data-accordion-item="operations">
      <button type="button" class="u-accordion-trigger" data-accordion-trigger="operations">
        <span class="u-accordion-trigger-left">
          <svg class="u-accordion-icon" viewBox="0 0 256 256" fill="currentColor">
            <path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/>
          </svg>
          <span>Image Operations</span>
        </span>
        <svg class="u-accordion-chevron" viewBox="0 0 256 256" fill="currentColor">
          <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
        </svg>
      </button>
      <div class="u-accordion-body">
        <div class="u-ops-row">
          <button
            id="btnCopyClipboard"
            type="button"
            class="u-btn u-btn-icon u-btn-soft tooltip-left"
            data-tooltip="Copy PNG to clipboard"
            aria-label="Copy PNG to clipboard"
