<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Skriptjobs - Screendump Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       @skriptjobs/ui + @nuxt/ui v4 Design System Tokens (Neutral Light & Dark)
       ========================================================================== */
    :root, html.light {
      color-scheme: light;
      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Light surfaces (--ui-bg*) */
      --ui-bg: #fafafa;
      --ui-bg-muted: #f4f4f5;
      --ui-bg-elevated: #ffffff;
      --ui-bg-accented: #e4e4e7;
      --ui-bg-inverted: #18181b;
      --ui-bg-card-hover: #f4f4f5;
      --ui-header-surface: rgba(244, 244, 245, 0.75);
      --ui-preview-stage: #f0f0f3;

      /* Neutral Borders (--ui-border*) */
      --ui-border: #e4e4e7;
      --ui-border-muted: #d4d4d8;
      --ui-border-accented: #a1a1aa;
      --ui-border-focus: #71717a;

      /* Typography (--ui-text*) */
      --ui-text-highlighted: #09090b;
      --ui-text: #18181b;
      --ui-text-muted: #52525b;
      --ui-text-dimmed: #71717a;

      /* Scrollbar tokens */
      --scrollbar-track: #f4f4f5;
      --scrollbar-thumb: #d4d4d8;
      --scrollbar-thumb-hover: #a1a1aa;

      --ui-radius: 0.5rem;
    }

    html.dark {
      color-scheme: dark;

      /* Achromatic dark surfaces (--ui-bg*) */
      --ui-bg: #0e0e0e;
      --ui-bg-muted: #1a1a1a;
      --ui-bg-elevated: #141414;
      --ui-bg-accented: #262626;
      --ui-bg-inverted: #f4f4f5;
      --ui-bg-card-hover: #1c1c1c;
      --ui-header-surface: rgba(26, 26, 26, 0.55);
      --ui-preview-stage: #080808;

      /* Neutral Borders (--ui-border*) */
      --ui-border: #262626;
      --ui-border-muted: #333333;
      --ui-border-accented: #52525b;
      --ui-border-focus: #71717a;

      /* Typography (--ui-text*) */
      --ui-text-highlighted: #ffffff;
      --ui-text: #e4e4e7;
      --ui-text-muted: #a1a1aa;
      --ui-text-dimmed: #71717a;

      /* Scrollbar tokens */
      --scrollbar-track: #141414;
      --scrollbar-thumb: #333333;
      --scrollbar-thumb-hover: #4b4b52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    body {
      width: 460px;
      background-color: var(--ui-bg);
      color: var(--ui-text);
      font-family: var(--font-sans);
      letter-spacing: -0.01rem;
      -webkit-font-smoothing: antialiased;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Header (Skriptjobs wordmark + Harmonic Plain Text Title) */
    .u-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ui-border);
    }
    .u-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .u-brand-logo {
      height: 28px;
      width: auto;
      display: block;
      margin-left: -4px;
      margin-right: -4px;
    }
    .u-divider-v {
      width: 1px;
      height: 15px;
      background: var(--ui-border-muted);
    }
    .u-brand-subtitle {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ui-text-muted);
      line-height: 1;
      transform: translateY(0.5px);
    }

    /* Nuxt UI UCard */
    .u-card {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
    }
    .u-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--ui-border);
      background: var(--ui-header-surface);
      border-top-left-radius: calc(var(--ui-radius) - 1px);
      border-top-right-radius: calc(var(--ui-radius) - 1px);
    }
    .u-card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ui-text-highlighted);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Live Mockup Preview Container (<ChromeIssueMockup />) with theme-aware top-right Open in Tab button */
    .mockup-preview-wrap {
      position: relative;
      background: var(--ui-preview-stage);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom-left-radius: calc(var(--ui-radius) - 1px);
      border-bottom-right-radius: calc(var(--ui-radius) - 1px);
    }
    canvas#previewCanvas {
      max-width: 100%;
      max-height: 168px;
      width: auto;
      height: auto;
      border-radius: 6px;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .preview-open-tab-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text-highlighted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
      z-index: 10;
    }
    .mockup-preview-wrap:hover .preview-open-tab-btn,
    .mockup-preview-wrap.force-hover .preview-open-tab-btn,
    .preview-open-tab-btn:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-open-tab-btn:hover {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
      color: var(--ui-text-highlighted);
      transform: scale(1.04);
    }

    /* ==========================================================================
       Nuxt UI UAccordion (type="single" collapsible — only 1 open at a time)
       ========================================================================== */
    .u-accordion {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius);
      overflow: visible;
      display: flex;
      flex-direction: column;
    }
    .u-accordion-item + .u-accordion-item {
      border-top: 1px solid var(--ui-border);
    }
    .u-accordion-trigger {
      width: 100%;
      appearance: none;
      background: transparent;
      border: none;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      padding: 7.5px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
      text-align: left;
    }
    .u-accordion-trigger:hover {
      background: var(--ui-bg-card-hover);
    }
    .u-accordion-trigger-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .u-accordion-icon {
      width: 14px;
      height: 14px;
      color: var(--ui-text-muted);
      flex-shrink: 0;
      transition: color 0.14s ease;
    }
    .u-accordion-item.open .u-accordion-icon {
      color: var(--ui-text-highlighted);
    }
    .u-accordion-chevron {
      width: 14px;
      height: 14px;
      color: var(--ui-text-muted);
      transition: transform 0.18s ease, color 0.18s ease;
      flex-shrink: 0;
    }
    .u-accordion-item.open .u-accordion-chevron {
      transform: rotate(180deg);
      color: var(--ui-text-highlighted);
    }
    .u-accordion-body {
      display: none;
      padding: 2px 12px 10px 12px;
      overflow: visible;
    }
    .u-accordion-item.open .u-accordion-body {
      display: block;
    }

    /* Wallpapers section subbar */
    .wp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .wp-toolbar-label {
      font-size: 11px;
      color: var(--ui-text-muted);
    }

    /* Multi-Wallpaper Gallery Grid (no hardcoded height or scrollbar) */
    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      overflow: visible;
    }
    .wp-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 44px 5px 5px;
      border-radius: 7px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      cursor: pointer;
      transition: all 0.14s ease;
      position: relative;
      overflow: visible;
    }
    .wp-item:hover,
    .wp-item.force-hover {
      background: var(--ui-bg-card-hover);
      border-color: var(--ui-border-muted);
    }
    .wp-item.active {
      border-color: var(--ui-border-accented);
      background: var(--ui-bg-muted);
      box-shadow: inset 0 0 0 1px var(--ui-border-muted);
    }
    .wp-thumb {
      width: 44px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--ui-border-muted);
      flex-shrink: 0;
    }
    .wp-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .wp-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ui-text-highlighted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wp-rename-input {
      width: 100%;
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-accented);
      border-radius: 4px;
      padding: 2px 5px;
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--ui-text-highlighted);
      outline: none;
    }

    /* Right actions on Wallpaper card: Default star badge + 3-dots menu button */
    .wp-corner-actions {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .wp-default-indicator {
      width: 18px;
      height: 18px;
      color: var(--ui-text-highlighted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
    }
    .wp-menu-btn {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ui-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .wp-menu-btn:hover,
    .wp-menu-btn.active {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-muted);
      color: var(--ui-text-highlighted);
    }

    /* 3-Dots Dropdown Menu on Wallpaper Card */
    .wp-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 152px;
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border-muted);
      border-radius: 7px;
      padding: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 1px;
    }
    .wp-dropdown.open {
      display: flex;
    }
    .wp-dropdown-item {
      appearance: none;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ui-text);
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      padding: 5.5px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .wp-dropdown-item:hover {
      background: var(--ui-bg-muted);
      color: var(--ui-text-highlighted);
    }
    .wp-dropdown-item svg {
      width: 13px;
      height: 13px;
      color: var(--ui-text-muted);
      flex-shrink: 0;
    }
    .wp-dropdown-item:hover svg {
      color: var(--ui-text-highlighted);
    }

    /* Neutral Buttons + Icon-only Square Buttons + UTooltip */
    .u-btn {
      appearance: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.14s ease;
      line-height: 1.2;
      position: relative;
    }
    .u-btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .u-btn-icon-sm {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .u-btn-soft,
    .u-btn-neutral {
      background: var(--ui-bg-muted);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text-highlighted);
    }
    .u-btn-soft:hover,
    .u-btn-neutral:hover {
      background: var(--ui-bg-accented);
      border-color: var(--ui-border-accented);
    }

    /* @nuxt/ui UTooltip styling */
    [data-tooltip]:not(.preview-open-tab-btn) {
      position: relative;
    }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-2px);
      background: var(--ui-bg-elevated);
      color: var(--ui-text-highlighted);
      border: 1px solid var(--ui-border-muted);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 50;
    }
    [data-tooltip].tooltip-right::after {
      left: auto;
      right: 0;
      transform: translateY(-2px);
    }
    [data-tooltip].tooltip-left::after {
      left: 0;
      transform: translateY(-2px);
    }
    [data-tooltip]:hover::after,
    [data-tooltip]:focus-visible::after,
    [data-tooltip].force-tooltip::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    [data-tooltip].tooltip-right:hover::after,
    [data-tooltip].tooltip-right.force-tooltip::after {
      opacity: 1;
      transform: translateY(0);
    }
    [data-tooltip].tooltip-left:hover::after,
    [data-tooltip].tooltip-left.force-tooltip::after {
      opacity: 1;
      transform: translateY(0);
    }

    /* Image Operations Row inside Accordion */
    .u-ops-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 2px;
    }
    .u-ops-flex {
      flex: 1;
      font-weight: 600;
    }

    /* Output & Settings Form Stacks */
    .u-settings-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 2px;
    }
    .u-form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .u-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .u-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--ui-text);
    }
    .u-hint {
      font-size: 10px;
      color: var(--ui-text-dimmed);
      font-family: var(--font-mono);
    }
    .u-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .u-input-icon {
      position: absolute;
      left: 9px;
      width: 13px;
      height: 13px;
      color: var(--ui-text-dimmed);
      pointer-events: none;
    }
    /* Neutral border input fields (no primary blue border) */
    .u-input {
      width: 100%;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
      border-radius: 6px;
      padding: 5.5px 9px 5.5px 28px;
      color: var(--ui-text-highlighted);
      font-family: var(--font-sans);
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .u-input.mono {
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .u-input:hover {
      border-color: var(--ui-border-accented);
    }
    .u-input:focus {
      border-color: var(--ui-border-focus);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui-text-muted) 16%, transparent);
    }

    /* Segmented Theme Control (System | Dark | Light) — Neutral */
    .u-theme-segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 7px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
    }
    .u-theme-option {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ui-text-muted);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4.5px 6px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.14s ease;
    }
    .u-theme-option:hover {
      color: var(--ui-text-highlighted);
      background: var(--ui-bg-card-hover);
    }
    .u-theme-option.active {
      background: var(--ui-bg-muted);
      border-color: var(--ui-border-muted);
      color: var(--ui-text-highlighted);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      font-weight: 600;
    }
    .u-theme-option svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* Neutral Switch Row (Sync Browser Mockup Theme) */
    .u-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border-muted);
    }
    .u-switch-copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .u-switch-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--ui-text-highlighted);
    }
    .u-switch-sub {
      font-size: 10px;
      color: var(--ui-text-muted);
    }
    .u-switch {
      appearance: none;
      width: 34px;
      height: 19px;
      border-radius: 9999px;
      background: var(--ui-bg-accented);
      border: 1px solid var(--ui-border-muted);
      position: relative;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease;
      flex-shrink: 0;
    }
    .u-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 9999px;
      background: var(--ui-text-muted);
      transition: transform 0.16s ease, background 0.16s ease;
    }
    .u-switch[aria-checked="true"] {
      background: var(--ui-text-highlighted);
      border-color: var(--ui-text-highlighted);
    }
    .u-switch[aria-checked="true"]::after {
      transform: translateX(15px);
      background: var(--ui-bg-elevated);
    }

    /* Status Toast Bar with Close Icon */
    .u-status {
      font-size: 11px;
      padding: 6px 8px 6px 10px;
      border-radius: 6px;
      background: var(--ui-bg-muted);
      border: 1px solid var(--ui-border-muted);
      color: var(--ui-text);
      display: none;
      word-break: break-word;
    }
    .u-status.visible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .u-status.success {
      border-color: rgba(40, 200, 64, 0.35);
      background: rgba(40, 200, 64, 0.1);
      color: #16a34a;
    }
    html.dark .u-status.success {
      color: #86efac;
    }
    .u-status.error {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #dc2626;
    }
    html.dark .u-status.error {
      color: #fca5a5;
    }
    .u-status-close {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: currentColor;
      opacity: 0.7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.12s ease, background 0.12s ease;
    }
    .u-status-close:hover {
